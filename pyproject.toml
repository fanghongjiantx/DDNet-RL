[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "ddnet-rl"
version = "0.1.0"
description = "DDNet RL environment for training AI agents on DDNet platformer levels"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[tool.maturin]
manifest-path = "rust_backend/Cargo.toml"
python-source = "ddnet_rl"
